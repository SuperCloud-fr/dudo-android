name: Android CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: SAST, secrets & vulnerable deps
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full git history, so gitleaks scans every commit

      - name: Secrets in code & history (gitleaks)
        run: |
          mkdir -p security
          VERSION=$(curl -fsSL -H "Authorization: Bearer $GITHUB_TOKEN" https://api.github.com/repos/gitleaks/gitleaks/releases/latest | jq -r .tag_name)
          echo "gitleaks ${VERSION}"
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/${VERSION}/gitleaks_${VERSION#v}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks detect \
            --source . \
            --redact --no-banner \
            --report-format json \
            --report-path security/gitleaks.json

      - name: Vulnerable Dart dependencies (osv-scanner)
        run: |
          VERSION=$(curl -fsSL -H "Authorization: Bearer $GITHUB_TOKEN" https://api.github.com/repos/google/osv-scanner/releases/latest | jq -r .tag_name)
          echo "osv-scanner ${VERSION}"
          curl -fsSL -o security/osv-scanner "https://github.com/google/osv-scanner/releases/download/${VERSION}/osv-scanner_linux_amd64"
          chmod +x security/osv-scanner
          ./security/osv-scanner scan --format markdown --output security/osv-report.md .

      - name: SAST — OWASP Top 10 (semgrep)
        run: |
          pip3 install --quiet semgrep
          semgrep \
            --config p/security-audit \
            --config p/owasp-top-ten \
            --config p/secrets \
            --exclude assets \
            --exclude docs \
            --exclude .github \
            --exclude .dart_tool \
            --exclude build \
            --metrics=off \
            --json --output security/semgrep.json || true
          jq '{
            error:  [.results[] | select(.extra.severity == "ERROR")   | (.check_id + ":" + (.path // "n/a"))],
            warning:[.results[] | select(.extra.severity == "WARNING") | (.check_id + ":" + (.path // "n/a"))]
          }' security/semgrep.json > security/semgrep-findings.json

      - name: Gate — block on ERROR severity
        run: |
          ERRORS=$(jq '.error | length' security/semgrep-findings.json)
          echo "semgrep: ${ERRORS} finding(s) of severity ERROR"
          if [ "${ERRORS}" != "0" ]; then
            jq -r '.error[]' security/semgrep-findings.json
            exit 1
          fi

      - name: Report
        if: always()
        run: |
          GITLEAKS=$(jq '(.results // []) | length' security/gitleaks.json 2>/dev/null || echo '?')
          SEMGREP_E=$(jq '.error // [] | length' security/semgrep-findings.json 2>/dev/null || echo '?')
          SEMGREP_W=$(jq '.warning // [] | length' security/semgrep-findings.json 2>/dev/null || echo '?')
          {
            echo "### Checks cyber — OWASP Top 10"
            echo ""
            echo "| Vérification | Outil | Résultat | Bloquant |"
            echo "|---|---|---|---|"
            echo "| Secrets dans le code et l'historique | gitleaks | ${GITLEAKS} leak(s) | oui |"
            echo "| Dépendances Dart avec CVE (pub.lock) | osv-scanner | voir rapport | oui |"
            echo "| SAST OWASP Top 10 / security-audit / secrets | semgrep | ${SEMGREP_E} ERROR, ${SEMGREP_W} WARNING | ERROR seulement |"
            echo "| Lint Android (release) | gradle lintRelease | voir rapport | non |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dudo-security-reports
          path: security/
          if-no-files-found: warn
          retention-days: 30

  build-apk:
    name: Test & build APK
    needs: security
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK 36
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager introuvable : $SDKMANAGER"
            ls "$SDK_ROOT/cmdline-tools" || true
            exit 1
          fi
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: dart analyze lib test

      - name: Test
        run: flutter test

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build release APK (arm64)
        # One engine copy, one ABI: the arm64 APK alone went 50MB -> 19.5MB.
        run: flutter build apk --release --target-platform android-arm64

      - name: Android lint (release)
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew --console=plain :app:lintRelease
        continue-on-error: true

      - name: Prepare APK
        id: prepare
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            NAME="dudo-${GITHUB_REF_NAME}.apk"
          else
            SAFE_REF=$(echo "${GITHUB_REF_NAME}" | tr "/" "-")
            NAME="dudo-${SAFE_REF}-${GITHUB_SHA::7}.apk"
          fi
          cp build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/${NAME}"
          echo "apk_path=build/app/outputs/flutter-apk/${NAME}" >> "$GITHUB_OUTPUT"
          echo "apk_name=${NAME}" >> "$GITHUB_OUTPUT"

      - name: Summarise
        run: |
          APK="${{ steps.prepare.outputs.apk_path }}"
          NAME="${{ steps.prepare.outputs.apk_name }}"
          ls -lh "$APK"
          echo "### Dudo — APK release (arm64)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit : \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Fichier : \`$NAME\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Taille : $(du -h "$APK" | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Téléchargement : artefact **dudo-android-apk** dans l'onglet Actions de ce run." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dudo-android-apk
          path: ${{ steps.prepare.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dudo-android-lint
          path: |
            android/app/build/reports/lint-results-release.html
            android/app/build/reports/lint-results-release.xml
          if-no-files-found: warn
          retention-days: 30

      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Dudo ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: ${{ steps.prepare.outputs.apk_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
