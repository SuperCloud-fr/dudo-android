<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" role="img" aria-label="Dudo — gobelet renversé, dés qui s'enfuient, DUDO gravé">
  <style>@import url('https://fonts.googleapis.com/css2?family=Alkatra:wght@700&amp;display=swap');</style>
  <rect width="760" height="560" fill="#2A1D13"/>
  <g stroke="#1C1209" stroke-width="3" opacity=".9">
    <line x1="0" y1="112" x2="760" y2="112"/><line x1="0" y1="238" x2="760" y2="238"/>
    <line x1="0" y1="358" x2="760" y2="358"/>
  </g>
  <defs>
    <g id="perroquet">
      <path d="M1,-14 C4.2,-14 6.8,-11.8 7.2,-9.2 L12,-6.8 Q12.8,-5.6 11.6,-4.8 L7.4,-4.2
               Q8.6,-1 8,2 C7.4,5.6 4.8,8.2 1.4,9.2 L-8.5,16 L-4,8.6 L-7,14 L-2.6,7.4
               C-4.4,4.8 -4.9,0.6 -4,-3.6 C-3,-9.4 -0.6,-14 1,-14 Z"/>
    </g>
  </defs>
  <!-- ombres -->
  <g fill="#140D07" opacity=".65">
    <ellipse cx="235" cy="305" rx="120" ry="14"/>
    <ellipse cx="410" cy="326" rx="30" ry="8"/><ellipse cx="500" cy="281" rx="30" ry="8"/>
    <ellipse cx="585" cy="346" rx="30" ry="8"/><ellipse cx="350" cy="371" rx="30" ry="8"/>
    <ellipse cx="470" cy="376" rx="30" ry="8"/>
  </g>
  <!-- gobelet renversé, posé sur son bord, légèrement penché -->
  <g transform="translate(235,165) scale(1,-1) rotate(-8) translate(0,-40)">
    <path d="M-100,-78 L100,-78 Q114,-78 112,-64 L60,66 Q56,80 42,80 L-42,80
             Q-56,80 -60,66 L-112,-64 Q-114,-78 -100,-78 Z"
          fill="#6B4326" stroke="#F5EFDF" stroke-width="5" stroke-linejoin="round"/>
    <rect x="-106" y="-78" width="212" height="20" rx="9" fill="#4A2F1A"/>
    <line x1="-96" y1="-28" x2="96" y2="-28" stroke="#F5EFDF" stroke-width="3" opacity=".35"/>
    <line x1="-88" y1="12" x2="88" y2="12" stroke="#F5EFDF" stroke-width="3" opacity=".35"/>
    <ellipse cx="0" cy="76" rx="52" ry="10" fill="#4A2F1A"/>
  </g>
  <!-- dé 5 -->
  <g transform="translate(410,300) rotate(14)">
    <rect x="-22" y="-22" width="44" height="44" rx="10" fill="#E8A33B" stroke="#2A1D13" stroke-width="3"/>
    <g fill="#F5EFDF"><circle cx="-12.5" cy="-12.5" r="5"/><circle cx="12.5" cy="-12.5" r="5"/>
      <circle cx="0" cy="0" r="5"/><circle cx="-12.5" cy="12.5" r="5"/><circle cx="12.5" cy="12.5" r="5"/></g>
  </g>
  <!-- dé 2 -->
  <g transform="translate(500,255) rotate(-16)">
    <rect x="-22" y="-22" width="44" height="44" rx="10" fill="#E8A33B" stroke="#2A1D13" stroke-width="3"/>
    <g fill="#F5EFDF"><circle cx="-12.5" cy="-12.5" r="5"/><circle cx="12.5" cy="12.5" r="5"/></g>
  </g>
  <!-- dé 6 -->
  <g transform="translate(585,320) rotate(6)">
    <rect x="-22" y="-22" width="44" height="44" rx="10" fill="#E8A33B" stroke="#2A1D13" stroke-width="3"/>
    <g fill="#F5EFDF"><circle cx="-12.5" cy="-12.5" r="5"/><circle cx="-12.5" cy="0" r="5"/>
      <circle cx="-12.5" cy="12.5" r="5"/><circle cx="12.5" cy="-12.5" r="5"/>
      <circle cx="12.5" cy="0" r="5"/><circle cx="12.5" cy="12.5" r="5"/></g>
  </g>
  <!-- dé 3 -->
  <g transform="translate(350,345) rotate(-20)">
    <rect x="-22" y="-22" width="44" height="44" rx="10" fill="#E8A33B" stroke="#2A1D13" stroke-width="3"/>
    <g fill="#F5EFDF"><circle cx="-12.5" cy="-12.5" r="5"/><circle cx="0" cy="0" r="5"/>
      <circle cx="12.5" cy="12.5" r="5"/></g>
  </g>
  <!-- dé 1 : l'as au perroquet -->
  <g transform="translate(470,350) rotate(-8)">
    <rect x="-22" y="-22" width="44" height="44" rx="10" fill="#E8A33B" stroke="#2A1D13" stroke-width="3"/>
    <g transform="scale(1.35) translate(-1,1)" fill="#F5EFDF"><use href="#perroquet"/></g>
  </g>
  <!-- wordmark -->
  <text x="384" y="506" text-anchor="middle" font-family="Alkatra, 'Georgia', serif" font-weight="700"
        font-size="92" letter-spacing="12" fill="#F5EFDF">DUDO</text>
  <text x="384" y="546" text-anchor="middle" font-family="'Alegreya Sans', 'Segoe UI', sans-serif"
        font-size="16" letter-spacing="8" fill="#E8A33B">LE PERUDO DE TAVERNE</text>
</svg>
