<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="Icône Dudo — gobelet or renversé et as ivoire au perroquet">
  <defs>
    <g id="perroquet">
      <path d="M1,-14 C4.2,-14 6.8,-11.8 7.2,-9.2 L12,-6.8 Q12.8,-5.6 11.6,-4.8 L7.4,-4.2
               Q8.6,-1 8,2 C7.4,5.6 4.8,8.2 1.4,9.2 L-8.5,16 L-4,8.6 L-7,14 L-2.6,7.4
               C-4.4,4.8 -4.9,0.6 -4,-3.6 C-3,-9.4 -0.6,-14 1,-14 Z"/>
    </g>
  </defs>
  <rect x="0" y="0" width="240" height="240" rx="54" fill="#2A1D13"/>
  <!-- gobelet or renversé -->
  <g transform="translate(6,64) scale(1,-1) rotate(-8) scale(.72) translate(120,120)">
    <path d="M-100,-78 L100,-78 Q114,-78 112,-64 L60,66 Q56,80 42,80 L-42,80
